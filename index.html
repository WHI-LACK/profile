<!doctype html>
<html lang="en" data-page="home" data-state="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper &amp; Signal — Ideas worth printing</title>
<meta name="description" content="An independent publisher of short books, one film and one podcast about how things actually work.">
<meta name="theme-color" content="#201819">
<!-- ?v= — bump this whenever you edit a stylesheet or script. GitHub Pages
     serves static files with a max-age, so without it browsers keep the old
     copy for minutes and it looks like your change never shipped. -->
<link rel="stylesheet" href="css/tokens.css?v=7">
<link rel="stylesheet" href="css/shell.css?v=7">
<link rel="stylesheet" href="css/catalog.css?v=7">
</head>
<body>

<a class="SkipLink" href="#catalogue">Skip to the catalogue</a>

<!-- =====================================================================
     The stage: a fixed colour fill, an optional tiled backdrop (film), and
     the WebGL canvas that draws the stack of books / the active book.
     ===================================================================== -->
<div class="Stage" aria-hidden="true">
  <div class="Stage__fill" id="stage-fill"></div>
  <div class="Stage__backdrop" id="stage-backdrop"></div>
  <div class="Stage__canvasBox">
    <canvas class="Stage__canvas" id="stage-canvas"></canvas>
  </div>
</div>

<!-- =====================================================================
     Fixed top-left menu: maker's mark, back control, the ruler of product
     indicators (scroll progress + jump targets), and the film / podcast /
     about controls.
     ===================================================================== -->
<nav class="Menu" id="menu" aria-label="Catalogue navigation">
  <button class="Menu__logo" id="menu-logo" aria-label="Paper &amp; Signal — back to the top">
    <svg class="Mark" viewBox="0 0 44 56" role="img" aria-hidden="true" focusable="false">
      <circle class="Mark__arc" cx="22" cy="28" r="17" pathLength="100" />
      <circle class="Mark__arc" cx="22" cy="28" r="11" pathLength="100" />
      <circle class="Mark__arc" cx="22" cy="28" r="5" pathLength="100" />
      <circle class="Mark__dot" cx="31" cy="39" r="2.2" />
    </svg>
  </button>

  <div class="Menu__rail">
    <button class="Menu__back" id="menu-back" type="button">
      <svg class="Menu__backIcon" viewBox="0 0 34 12" aria-hidden="true" focusable="false">
        <path d="M34 6H2M8 1 2 6l6 5" fill="none" stroke-width="1.5" />
      </svg>
      <span class="Menu__label Menu__backLabel" id="menu-backLabel"></span>
    </button>

    <ul class="Ruler" id="ruler"></ul>

    <button class="Menu__film" id="menu-film" type="button">
      <svg class="Menu__filmIcon" viewBox="0 0 16 13" aria-hidden="true" focusable="false">
        <rect x="0.5" y="0.5" width="15" height="12" fill="none" stroke-width="1" />
        <rect x="3" y="3" width="10" height="7" class="Menu__filmCell" />
      </svg>
      <span class="Menu__label" id="menu-filmLabel"></span>
    </button>

    <button class="Menu__podcast" id="menu-podcast" type="button">
      <svg class="Menu__podcastIcon" viewBox="0 0 15 15" aria-hidden="true" focusable="false">
        <circle cx="7.5" cy="7.5" r="6.5" fill="none" stroke-width="1" />
        <path d="M4 7.5h7" stroke-width="1" />
      </svg>
      <span class="Menu__label" id="menu-podcastLabel"></span>
    </button>

    <button class="Menu__about" id="menu-about" type="button" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="10" cy="10" r="9" fill="none" stroke-width="1" />
        <text x="10" y="14.5" text-anchor="middle" font-size="12">?</text>
      </svg>
      <span class="Menu__label" id="menu-aboutLabel"></span>
    </button>
  </div>
</nav>

<main class="Shell" id="shell">
  <header class="Intro" id="intro">
    <h1 class="Intro__brand" id="intro-brand"></h1>
    <p class="Intro__tagline" id="intro-tagline"></p>
  </header>

  <!-- Rows and detail panels are generated from js/content.js -->
  <div class="Catalogue" id="catalogue"></div>
  <div class="Details" id="details"></div>
</main>

<!-- =====================================================================
     The white end panel: about copy, newsletter, social, legal.
     ===================================================================== -->
<section class="Info" id="info" aria-labelledby="info-heading">
  <div class="Info__block">
    <button class="Info__close" id="info-close" type="button">
      <svg viewBox="0 0 12 34" aria-hidden="true" focusable="false">
        <path d="M6 34V2M1 8l5-6 5 6" fill="none" stroke-width="1.5" />
      </svg>
      <span class="Info__closeLabel"></span>
    </button>

    <h2 class="Info__heading" id="info-heading"></h2>
    <div class="Info__copy" id="info-copy"></div>

    <div class="Info__signup">
      <p class="Info__signupCopy" id="info-signup"></p>
      <form class="Signup" id="signup" novalidate>
        <label class="Signup__label" for="signup-email">Email address</label>
        <div class="Signup__row">
          <input class="Signup__input" id="signup-email" type="email" name="email" autocomplete="email"
                 placeholder="you@example.com">
          <button class="Signup__button" type="submit">Submit</button>
        </div>
        <p class="Signup__msg" id="signup-msg" role="status" aria-live="polite"></p>
      </form>
      <p class="Info__note" id="info-note"></p>
    </div>

    <div class="Info__social" id="info-social"></div>
    <div class="Info__legal" id="info-legal"></div>
  </div>
</section>

<!-- =====================================================================
     Film overlay — a full-screen title card with a procedural "trailer".
     ===================================================================== -->
<section class="Film" id="film" hidden aria-labelledby="film-title">
  <button class="Film__back" id="film-back" type="button">
    <svg viewBox="0 0 34 12" aria-hidden="true" focusable="false">
      <path d="M34 6H2M8 1 2 6l6 5" fill="none" stroke-width="1.5" />
    </svg>
    <span class="Menu__label">Close</span>
  </button>

  <div class="Film__poster" id="film-poster">
    <canvas class="Film__trailer" id="film-canvas"></canvas>
    <div class="Film__hero">
      <h2 class="Film__title" id="film-title"></h2>
      <div class="Film__titleFooter">
        <p class="Film__subTitle" id="film-subtitle"></p>
        <button class="Film__play" id="film-play" type="button">
          <svg viewBox="0 0 60 60" aria-hidden="true" focusable="false">
            <circle cx="30" cy="30" r="29" class="Film__playRing" />
            <path d="M24 19l18 11-18 11z" class="Film__playPath" />
          </svg>
          <span class="Film__playLabel" id="film-playLabel">Play trailer</span>
        </button>
      </div>
    </div>
    <div class="Film__scrollHint">Scroll for synopsis, score and credits</div>
  </div>

  <div class="Film__body">
    <section class="Film__section Film__section--synopsis">
      <div class="Film__column Film__column--synopsis">
        <h3 class="Film__columnTitle">Synopsis</h3>
        <p class="Film__bodyText" id="film-synopsis"></p>
      </div>
      <div class="Film__column Film__column--review">
        <h3 class="Film__columnTitle">Reviews</h3>
        <div id="film-reviews"></div>
      </div>
    </section>

    <section class="Film__section Film__section--score">
      <div class="Film__column Film__column--trackList">
        <h3 class="Film__columnTitle">Score</h3>
        <ol class="Tracks" id="film-tracks"></ol>
      </div>
      <div class="Film__column Film__column--score">
        <h3 class="Film__columnTitle">Credits</h3>
        <dl class="Credits" id="film-credits"></dl>
      </div>
    </section>

    <a class="Film__ticker" id="film-ticker" href="#catalogue">
      <span class="Film__tickerText" id="film-tickerText"></span>
    </a>
  </div>
</section>

<!-- Podcast transcript overlay -->
<section class="Transcript" id="transcript" hidden aria-labelledby="transcript-title">
  <button class="Transcript__back" id="transcript-back" type="button">
    <svg viewBox="0 0 34 12" aria-hidden="true" focusable="false">
      <path d="M34 6H2M8 1 2 6l6 5" fill="none" stroke-width="1.5" />
    </svg>
    <span class="Menu__label">Close</span>
  </button>
  <h2 class="Transcript__title" id="transcript-title"></h2>
  <div class="Transcript__bar"><span class="Transcript__fill" id="transcript-fill"></span></div>
  <div class="Transcript__body" id="transcript-body"></div>
</section>

<!-- =====================================================================
     Engineering drawer: live sliders for the 3D stage.
     ===================================================================== -->
<aside class="Panel" id="panel" aria-labelledby="panel-title" hidden>
  <div class="Panel__header">
    <h3 id="panel-title"></h3>
    <button class="Panel__close" id="panel-close" type="button" aria-label="Close">×</button>
  </div>
  <div class="Panel__content" id="panel-content"></div>
  <div class="Panel__foot">
    <button class="Panel__copy" id="panel-copy" type="button"></button>
  </div>
</aside>

<!-- Dismissible card, bottom right -->
<div class="NewCard" id="newcard" hidden>
  <div class="NewCard__body">
    <p class="NewCard__title" id="newcard-title"></p>
    <p class="NewCard__sub" id="newcard-sub"></p>
  </div>
  <div class="NewCard__actions">
    <a class="NewCard__cta" id="newcard-cta" href="#catalogue"></a>
    <button class="NewCard__dismiss" id="newcard-dismiss" type="button"></button>
  </div>
</div>

<!-- Fallback / error surface: never silently blank -->
<div class="Diag" id="diag" hidden>
  <p class="Diag__title">Something is off</p>
  <pre class="Diag__body" id="diag-body"></pre>
</div>

<noscript>
  <p style="padding:4vw;color:#fff">This catalogue needs JavaScript for the 3D stage. The text of every
  title is still in <code>js/content.js</code>.</p>
</noscript>

<script src="js/content.js?v=7"></script>
<script src="js/covers.js?v=7"></script>
<script src="js/gl.js?v=7"></script>
<script src="js/audio.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
